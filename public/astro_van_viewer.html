<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro-Futuristic Hover Van — Interactive 3D Model</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 Core & Addons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #060a12;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .glass-panel {
            background: rgba(18, 19, 36, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 245, 255, 0.22);
            box-shadow: 0 12px 32px rgba(10, 12, 28, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }
        .cyber-btn {
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cyber-btn:hover {
            transform: translateY(-1px);
            border-color: rgba(0, 245, 255, 0.65);
            box-shadow: 0 0 16px rgba(0, 245, 255, 0.25);
        }
        .cyber-btn.active {
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.25), rgba(115, 65, 255, 0.3));
            border-color: #00f5ff;
            color: #ffffff;
            box-shadow: 0 0 14px rgba(0, 245, 255, 0.35);
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.14);
            height: 6px;
            border-radius: 999px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00f5ff;
            box-shadow: 0 0 10px #00f5ff;
            cursor: pointer;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="relative">

    <!-- 3D Viewport Container -->
    <div id="canvas-container"></div>

    <script>
        // Polyfill Canvas roundRect for all browsers
        if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (typeof r === 'undefined') r = 0;
                if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                else {
                    var defaultR = { tl: 0, tr: 0, br: 0, bl: 0 };
                    for (var side in defaultR) r[side] = r[side] || defaultR[side];
                }
                this.beginPath();
                this.moveTo(x + r.tl, y);
                this.lineTo(x + w - r.tr, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
                this.lineTo(x + w, y + h - r.br);
                this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
                this.lineTo(x + r.bl, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
                this.lineTo(x, y + r.tl);
                this.quadraticCurveTo(x, y, x + r.tl, y);
                this.closePath();
                return this;
            };
        }

        // ============================================================================
        // 1. PROCEDURAL TEXTURE GENERATORS (100% Self-Contained High-Res Textures)
        // ============================================================================

        // Carbon Fiber Weave Texture (Deep Obsidian-Black Weave)
        function createCarbonFiberTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#0a0b10';
            ctx.fillRect(0, 0, 256, 256);

            const step = 16;
            for (let y = 0; y < 256; y += step) {
                for (let x = 0; x < 256; x += step) {
                    const isAlt = ((x / step) + (y / step)) % 2 === 0;
                    const grad = ctx.createLinearGradient(x, y, x + step, y + step);
                    if (isAlt) {
                        grad.addColorStop(0, '#1e202d');
                        grad.addColorStop(0.5, '#11121b');
                        grad.addColorStop(1, '#08080d');
                    } else {
                        grad.addColorStop(0, '#090a10');
                        grad.addColorStop(0.5, '#181a25');
                        grad.addColorStop(1, '#252838');
                    }
                    ctx.fillStyle = grad;
                    ctx.fillRect(x, y, step - 1, step - 1);
                }
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(6, 2);
            return tex;
        }

        // Radar Dish Target Face Texture (Dark Midnight-Cyan Void with Vibrant Cyan Glow)
        function createRadarFaceTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            const cx = 512, cy = 512;

            // Deep saturated electric-blue concave umbrella gradient
            const bgGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 510);
            bgGrad.addColorStop(0, '#e8ffff');
            bgGrad.addColorStop(0.12, '#00f5ff');
            bgGrad.addColorStop(0.32, '#00b4f0');
            bgGrad.addColorStop(0.58, '#0062a8');
            bgGrad.addColorStop(0.84, '#002f5a');
            bgGrad.addColorStop(0.95, '#00f5ff');
            bgGrad.addColorStop(1.0, '#00142b');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 1024, 1024);

            // Radiant Electric Blue concentric target rings
            ctx.strokeStyle = '#c2ffff';
            ctx.shadowColor = '#00f5ff';
            ctx.shadowBlur = 24;
            const radii = [120, 220, 325, 445];
            radii.forEach((r, idx) => {
                ctx.lineWidth = idx === 3 ? 18 : 11;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.stroke();
            });

            // Glowing Electric Blue crosshairs
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.moveTo(cx, cy - 450);
            ctx.lineTo(cx, cy + 450);
            ctx.moveTo(cx - 450, cy);
            ctx.lineTo(cx + 450, cy);
            ctx.stroke();

            // Glowing radar blip beacons
            const blips = [
                { angle: -0.78, dist: 385, size: 18 },
                { angle: 0.25, dist: 280, size: 24 },
                { angle: 2.35, dist: 275, size: 19 },
                { angle: 2.85, dist: 380, size: 16 },
                { angle: -2.2, dist: 175, size: 14 }
            ];
            ctx.fillStyle = '#ffffff';
            blips.forEach(b => {
                const bx = cx + Math.cos(b.angle) * b.dist;
                const by = cy + Math.sin(b.angle) * b.dist;
                ctx.beginPath();
                ctx.arc(bx, by, b.size, 0, Math.PI * 2);
                ctx.fill();
            });

            return new THREE.CanvasTexture(canvas);
        }

        // Holographic Vertical UI Screen Texture (Translucent Cyan UI Screen)
        function createHologramUITexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 640;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, 512, 640);

            // Translucent cyan holographic glass base
            const grad = ctx.createLinearGradient(0, 0, 0, 640);
            grad.addColorStop(0, 'rgba(0, 245, 255, 0.36)');
            grad.addColorStop(0.5, 'rgba(0, 210, 255, 0.22)');
            grad.addColorStop(1, 'rgba(0, 245, 255, 0.42)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            if (typeof ctx.roundRect === 'function') {
                try {
                    ctx.roundRect(12, 12, 488, 616, 36);
                } catch(e) {
                    ctx.rect(12, 12, 488, 616);
                }
            } else {
                ctx.rect(12, 12, 488, 616);
            }
            ctx.fill();

            // Glowing border frame
            ctx.strokeStyle = 'rgba(160, 255, 255, 0.95)';
            ctx.lineWidth = 6;
            ctx.stroke();

            // Fine background grid
            ctx.strokeStyle = 'rgba(0, 245, 255, 0.25)';
            ctx.lineWidth = 1.5;
            for (let x = 28; x < 484; x += 24) {
                ctx.beginPath(); ctx.moveTo(x, 28); ctx.lineTo(x, 612); ctx.stroke();
            }
            for (let y = 28; y < 612; y += 24) {
                ctx.beginPath(); ctx.moveTo(28, y); ctx.lineTo(484, y); ctx.stroke();
            }

            // Top Header Bar
            ctx.fillStyle = 'rgba(180, 255, 255, 0.85)';
            ctx.fillRect(40, 42, 220, 18);
            ctx.fillStyle = 'rgba(0, 245, 255, 0.55)';
            ctx.fillRect(280, 42, 185, 18);

            // Left Data Readout Lines
            for (let i = 0; i < 6; i++) {
                ctx.fillStyle = 'rgba(200, 255, 255, 0.9)';
                ctx.fillRect(40, 88 + i * 24, 150 - (i % 3) * 25, 8);
                ctx.fillStyle = 'rgba(0, 245, 255, 0.5)';
                ctx.fillRect(40, 100 + i * 24, 110, 4);
            }

            // Sine Wave & Telemetry Graph
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            for (let x = 210; x <= 465; x += 4) {
                const norm = (x - 210) / 255;
                const y = 220 + Math.sin(norm * Math.PI * 2.5) * 55 * Math.sin(norm * Math.PI);
                if (x === 210) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // 4x5 Matrix Grid of Square Data Pads
            ctx.fillStyle = 'rgba(195, 255, 255, 0.92)';
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 4; c++) {
                    ctx.fillRect(44 + c * 32, 340 + r * 32, 20, 20);
                }
            }

            // Lower-Right Rectangular Data Bars
            ctx.fillStyle = 'rgba(170, 255, 255, 0.75)';
            ctx.fillRect(280, 350, 180, 26);
            ctx.fillRect(280, 465, 180, 28);
            ctx.fillRect(280, 515, 180, 28);

            return new THREE.CanvasTexture(canvas);
        }

        // Diagnostic Side LCD Screen Texture (High Contrast Navy & Cyan)
        function createDiagnosticScreenTexture(variant = 1) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#011520';
            ctx.fillRect(0, 0, 256, 256);

            // Grid
            ctx.strokeStyle = 'rgba(0, 245, 255, 0.28)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 256; i += 24) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(256, i); ctx.stroke();
            }

            // Glowing cyan border
            ctx.strokeStyle = '#00f5ff';
            ctx.lineWidth = 10;
            ctx.strokeRect(8, 8, 240, 240);

            // Data blocks & bars
            ctx.fillStyle = '#8fffff';
            if (variant === 1) {
                for (let y = 32; y < 220; y += 22) {
                    const w = 60 + ((y * 17) % 130);
                    ctx.fillRect(28, y, w, 12);
                }
            } else {
                for (let y = 28; y < 140; y += 18) {
                    ctx.fillRect(26, y, 175 - (y % 50), 10);
                }
                ctx.fillStyle = '#00f5ff';
                ctx.fillRect(26, 160, 90, 64);
                ctx.fillStyle = '#c5ffff';
                ctx.fillRect(130, 160, 95, 28);
                ctx.fillRect(130, 196, 95, 28);
            }

            return new THREE.CanvasTexture(canvas);
        }

        // Waffle Headlight Lens Texture
        function createHeadlightTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createRadialGradient(128, 128, 10, 128, 128, 125);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.55, '#c5f2ff');
            grad.addColorStop(0.85, '#518ca8');
            grad.addColorStop(1, '#182433');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);

            ctx.strokeStyle = 'rgba(20, 38, 58, 0.65)';
            ctx.lineWidth = 4;
            for (let i = 0; i <= 256; i += 24) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(256, i); ctx.stroke();
            }

            return new THREE.CanvasTexture(canvas);
        }

        // Perforated Side Exhaust Shield Texture (Dark Gunmetal-Violet Finish)
        function createPerforatedExhaustTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Dark metallic gunmetal-violet shield gradient
            const grad = ctx.createLinearGradient(0, 0, 0, 256);
            grad.addColorStop(0, '#534e72');
            grad.addColorStop(0.35, '#393554');
            grad.addColorStop(0.7, '#221f35');
            grad.addColorStop(1, '#443f60');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 256);

            // Dark end collars
            ctx.fillStyle = '#4c476b';
            ctx.fillRect(0, 0, 512, 22);
            ctx.fillRect(0, 234, 512, 22);

            // Deep perforations
            for (let y = 38; y <= 218; y += 26) {
                const offset = ((y - 38) / 26) % 2 === 0 ? 0 : 16;
                for (let x = 20 + offset; x < 492; x += 32) {
                    ctx.fillStyle = '#6f6a91';
                    ctx.beginPath();
                    ctx.arc(x + 1, y + 1, 9.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#07060d';
                    ctx.beginPath();
                    ctx.arc(x, y, 8.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            return new THREE.CanvasTexture(canvas);
        }

        // Procedural Studio HDRI Environment Map Generator (Provides Octane Specular Reflections)
        function createStudioEnvMap(renderer) {
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            pmremGenerator.compileEquirectangularShader();

            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Deep midnight studio gradient
            const bgGrad = ctx.createLinearGradient(0, 0, 0, 512);
            bgGrad.addColorStop(0, '#0d0d1a');
            bgGrad.addColorStop(0.5, '#161528');
            bgGrad.addColorStop(0.75, '#100f20');
            bgGrad.addColorStop(1, '#1a1832');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 1024, 512);

            // Overhead studio softbox strip (sharp white specular highlight)
            ctx.fillStyle = '#ffffff';
            ctx.filter = 'blur(10px)';
            ctx.fillRect(280, 30, 460, 65);

            // Vibrant Violet/Magenta Rim Light (creates the purple sheen on top/edges)
            ctx.fillStyle = '#b854ff';
            ctx.filter = 'blur(24px)';
            ctx.fillRect(780, 100, 200, 260);

            // Electric Cyan Accent Light (thruster bounce & side reflection)
            ctx.fillStyle = '#00f5ff';
            ctx.filter = 'blur(22px)';
            ctx.fillRect(60, 140, 220, 220);
            ctx.fillRect(360, 360, 300, 100);

            ctx.filter = 'none';
            const texture = new THREE.CanvasTexture(canvas);
            texture.mapping = THREE.EquirectangularReflectionMapping;
            const envMap = pmremGenerator.fromEquirectangular(texture).texture;
            pmremGenerator.dispose();
            return envMap;
        }

        // ============================================================================
        // 2. SCENE, CAMERA, RENDERER & STUDIO LIGHTING SETUP
        // ============================================================================
        let scene, camera, renderer, controls;
        let hoverVanGroup, astronautGroup, radarAssemblyGroup, holoGroup, thrustersGroup = [];
        let thrusterFlames = [];
        let explodeTargets = [];
        let isAnimating = true;
        let isTurntable = false; // Fixed still position - NO auto-rotation
        let isWireframe = false;
        let isDarkStudio = true;
        let manualRadarAngle = null;
        let clock = new THREE.Clock();

        function initScene() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060a12); // Sleek cyber dark background

            camera = new THREE.PerspectiveCamera(24, window.innerWidth / window.innerHeight, 0.1, 200);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.02; // Rich contrast with deep inky darks
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            // Set up environment reflections on all metallic materials
            const studioEnv = createStudioEnvMap(renderer);
            scene.environment = studioEnv;

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.maxDistance = 45;
            controls.minDistance = 4;
            camera.position.set(7.5, 6.2, 7.2);
            controls.target.set(0.05, 1.25, 0.0);
            controls.update();

            setupStudioLighting();
            buildCompleteModel();
            setCameraView('iso');
            isTransitioningCam = false;

            window.addEventListener('resize', onWindowResize);
            setupUIListeners();
            animate();
        }

        function setupStudioLighting() {
            // Controlled Studio Ambient (Darker for deep rich metallic contrast)
            const hemiLight = new THREE.HemisphereLight(0x7682a8, 0x121024, 0.52);
            scene.add(hemiLight);

            // Main Studio Key Light (Top-Front-Left)
            const keyLight = new THREE.DirectionalLight(0xffffff, 1.35);
            keyLight.position.set(12, 22, 14);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            keyLight.shadow.camera.near = 5;
            keyLight.shadow.camera.far = 50;
            const d = 6.5;
            keyLight.shadow.camera.left = -d;
            keyLight.shadow.camera.right = d;
            keyLight.shadow.camera.top = d;
            keyLight.shadow.camera.bottom = -d;
            keyLight.shadow.bias = -0.0005;
            scene.add(keyLight);

            // Vibrant Violet / Magenta Octane Rim Light (Left / Rear-Left)
            const violetRim = new THREE.DirectionalLight(0x9b51e0, 2.2);
            violetRim.position.set(-14, 10, -10);
            scene.add(violetRim);

            // Warm Purple Side Fill
            const purpleFill = new THREE.DirectionalLight(0x6e52c8, 1.1);
            purpleFill.position.set(15, 6, -6);
            scene.add(purpleFill);

            // Front-Right Neon Cyan Rim Fill
            const cyanFrontRim = new THREE.DirectionalLight(0x00d2ff, 1.25);
            cyanFrontRim.position.set(10, 4, 12);
            scene.add(cyanFrontRim);

            // Neon Cyan Emissive Accent Point Lights
            const cyanRadarLight = new THREE.PointLight(0x00f5ff, 2.4, 7.5);
            cyanRadarLight.position.set(0.15, 4.1, 0.25);
            scene.add(cyanRadarLight);

            const cyanVisorLight = new THREE.PointLight(0x00f5ff, 1.8, 4.5);
            cyanVisorLight.position.set(-0.55, 3.1, 2.1);
            scene.add(cyanVisorLight);

            const cyanHoloLight = new THREE.PointLight(0x00f5ff, 1.7, 5.5);
            cyanHoloLight.position.set(0.85, 3.9, -1.7);
            scene.add(cyanHoloLight);

            // Floor Shadow Catcher Plane
            const shadowPlaneGeo = new THREE.PlaneGeometry(40, 40);
            const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.18 });
            const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
            shadowPlane.rotation.x = -Math.PI / 2;
            shadowPlane.position.y = -1.42;
            shadowPlane.receiveShadow = true;
            scene.add(shadowPlane);

            // 4 Glowing Floor Plasma Projection Discs Under Thrusters (Electric Blue)
            [
                { x: 1.83, z: 1.42 },
                { x: -1.83, z: 1.42 },
                { x: 1.83, z: -1.42 },
                { x: -1.83, z: -1.42 }
            ].forEach(tp => {
                const glowDisc = new THREE.Mesh(
                    new THREE.CircleGeometry(0.68, 28),
                    new THREE.MeshBasicMaterial({
                        color: 0x00f5ff,
                        transparent: true,
                        opacity: 0.35,
                        depthWrite: false
                    })
                );
                glowDisc.rotation.x = -Math.PI / 2;
                glowDisc.position.set(tp.x, -1.41, tp.z);
                glowDisc.userData.baseScale = 1.0;
                scene.add(glowDisc);
                thrusterFlames.push({ type: 'groundDisc', mesh: glowDisc });
            });
        }

        // ============================================================================
        // 3. SHARED MATERIALS PALETTE (DARK METALLIC INDIGO & VIBRANT ACCENTS)
        // ============================================================================
        let mats = {};

        function initMaterials() {
            const carbonTex = createCarbonFiberTexture();
            const radarTex = createRadarFaceTexture();
            const holoTex = createHologramUITexture();
            const lcdTex1 = createDiagnosticScreenTexture(1);
            const lcdTex2 = createDiagnosticScreenTexture(2);
            const headlightTex = createHeadlightTexture();
            const exhaustTex = createPerforatedExhaustTexture();

            mats = {
                // Main Van Hull: Dark metallic midnight indigo-purple (Exact Match)
                vanBody: new THREE.MeshStandardMaterial({
                    color: 0x15142b,
                    metalness: 0.85,
                    roughness: 0.20
                }),
                // Secondary Bevel / Door Trim: Dark slate indigo-violet
                vanTrim: new THREE.MeshStandardMaterial({
                    color: 0x22203f,
                    metalness: 0.80,
                    roughness: 0.24
                }),
                // Hardware: Dark brushed titanium gunmetal (Bull bar, rails, hinges, muffler)
                silverMetal: new THREE.MeshStandardMaterial({
                    color: 0x44485e,
                    metalness: 0.92,
                    roughness: 0.20
                }),
                // Dark Obsidian Metal (Slats, wipers, greeble recesses, brackets)
                darkMetal: new THREE.MeshStandardMaterial({
                    color: 0x0e0f17,
                    metalness: 0.82,
                    roughness: 0.32
                }),
                // Purple Anodized Metal (Radar pedestal ring, hydraulic links)
                purpleAnodized: new THREE.MeshStandardMaterial({
                    color: 0x331c5c,
                    metalness: 0.86,
                    roughness: 0.20
                }),
                // Dark Royal Purple License Plate
                licensePlate: new THREE.MeshStandardMaterial({
                    color: 0x241756,
                    metalness: 0.65,
                    roughness: 0.28
                }),
                // Carbon Fiber Trim (Deep black graphite weave)
                carbonFiber: new THREE.MeshStandardMaterial({
                    map: carbonTex,
                    bumpMap: carbonTex,
                    bumpScale: 0.018,
                    metalness: 0.62,
                    roughness: 0.30
                }),
                // Tinted Obsidian Glass (High reflection, pitch tint)
                windshield: new THREE.MeshStandardMaterial({
                    color: 0x080b16,
                    metalness: 0.96,

        // Helper for Rounded Box Meshes
        function makeRBox(w, h, d, r, mat, segs = 4) {
            let geo;
            if (typeof THREE.RoundedBoxGeometry !== 'undefined') {
                try {
                    geo = new THREE.RoundedBoxGeometry(w, h, d, segs, r);
                } catch(e) {
                    geo = new THREE.BoxGeometry(w, h, d);
                }
            } else {
                geo = new THREE.BoxGeometry(w, h, d);
            }
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        // Helper to register Exploded View subsystems
        function registerExplodePart(obj, offsetVec) {
            obj.userData.basePos = obj.position.clone();
            obj.userData.explodeOffset = offsetVec.clone();
            explodeTargets.push(obj);
        }

        // 4. MASTER 3D MODEL CONSTRUCTION (EVERY SINGLE DETAIL INCLUDED)
        // ============================================================================
        function buildCompleteModel() {
            try { initMaterials(); } catch(e) { console.error("Error in initMaterials:", e); }

            hoverVanGroup = new THREE.Group();
            scene.add(hoverVanGroup);

            const builders = [
                ['Chassis', buildChassisAndCab],
                ['FrontGrille', buildFrontGrilleAndBullBar],
                ['SideGreebles', buildSideGreeblesAndExhaust],
                ['RearHull', buildRearHullDetails],
                ['HoverThrusters', buildHoverThrusters],
                ['RoofArray', buildRoofArrayAndRadar],
                ['HologramProjector', buildHologramProjector],
                ['Astronaut', buildAstronautCharacter]
            ];

            builders.forEach(([name, fn]) => {
                try {
                    fn();
                } catch(err) {
                    console.error("Failed building section " + name + ":", err);
                }
            });

            // Count total 3D meshes for the inspector badge
            let meshCount = 0;
            hoverVanGroup.traverse(c => { if (c.isMesh) meshCount++; });
            const partCounter = document.getElementById('part-counter');
            if (partCounter) partCounter.textContent = `${meshCount} 3D Meshes`;
        }

        // ============================================================================
        // 5. CAMERA PRESETS, ANIMATION LOOP & INTERACTIVE STUDIO CONTROLS
        // ============================================================================
        let targetCamPos = new THREE.Vector3();
        let targetLookAt = new THREE.Vector3();
        let isTransitioningCam = false;

        function setCameraView(preset) {
            document.querySelectorAll('[id^="cam-"]').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`cam-${preset}`);
            if (activeBtn) activeBtn.classList.add('active');

            isTransitioningCam = true;

            switch (preset) {
                case 'iso':
                    // Framed close-up so 3D Astro-van is big, prominent, and clearly visible
                    targetCamPos.set(7.2, 5.8, 7.0);
                    targetLookAt.set(0.05, 1.25, 0.0);
                    break;
                case 'astronaut':
                    targetCamPos.set(3.2, 4.8, 6.8);
                    targetLookAt.set(-0.45, 2.75, 1.55);
                    break;
                case 'radar':
                    targetCamPos.set(6.5, 6.2, 3.8);
                    targetLookAt.set(0.35, 3.55, -0.65);
                    break;
                case 'side':
                    targetCamPos.set(9.8, 2.6, -0.2);
                    targetLookAt.set(0.6, 1.0, -0.2);
                    break;
                case 'front':
                    targetCamPos.set(0.0, 3.2, 11.5);
                    targetLookAt.set(0.0, 1.15, 0.5);
                    break;
                case 'rear':
                    targetCamPos.set(-9.5, 5.8, -10.5);
                    targetLookAt.set(0.0, 1.35, -0.2);
                    break;
            }
        }

        function setupUIListeners() {
            controls.addEventListener('start', () => {
                isTransitioningCam = false;
            });

            const explodeSlider = document.getElementById('explode-slider');
            const explodeVal = document.getElementById('explode-val');
            if (explodeSlider && explodeVal) {
                explodeSlider.addEventListener('input', (e) => {
                    const factor = parseFloat(e.target.value) / 100;
                    explodeVal.textContent = `${e.target.value}%`;
                    explodeTargets.forEach(obj => {
                        obj.position.copy(obj.userData.basePos).addScaledVector(obj.userData.explodeOffset, factor);
                    });
                });
            }

            const radarSlider = document.getElementById('radar-slider');
            const radarVal = document.getElementById('radar-val');
            if (radarSlider && radarVal) {
                radarSlider.addEventListener('input', (e) => {
                    const deg = parseFloat(e.target.value);
                    manualRadarAngle = THREE.MathUtils.degToRad(deg) + 0.68;
                    radarVal.textContent = `${deg}°`;
                });
            }
        }

        function toggleAnimation() {
            isAnimating = !isAnimating;
            const btnAnim = document.getElementById('btn-anim');
            if (btnAnim) btnAnim.classList.toggle('active', isAnimating);
            if (isAnimating) {
                manualRadarAngle = null;
                const radarVal = document.getElementById('radar-val');
                if (radarVal) radarVal.textContent = 'Auto';
            }
        }

        function toggleTurntable() {
            isTurntable = !isTurntable;
            const btnTurntable = document.getElementById('btn-turntable');
            if (btnTurntable) btnTurntable.classList.toggle('active', isTurntable);
        }

        function toggleWireframe() {
            isWireframe = !isWireframe;
            const btnWireframe = document.getElementById('btn-wireframe');
            if (btnWireframe) btnWireframe.classList.toggle('active', isWireframe);
            Object.values(mats).forEach(m => {
                if (m && typeof m.wireframe === 'boolean') {
                    m.wireframe = isWireframe;
                }
            });
        }

        function toggleStudioBg() {
            isDarkStudio = !isDarkStudio;
            const btn = document.getElementById('btn-bg');
            if (btn) {
                btn.classList.toggle('active', isDarkStudio);
                btn.textContent = isDarkStudio ? 'Light Studio' : 'Dark Studio';
            }
            scene.background = new THREE.Color(isDarkStudio ? 0x0b0c18 : 0xf2f2f5);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.textContent = msg;
                toast.style.opacity = '1';
                setTimeout(() => { toast.style.opacity = '0'; }, 2800);
            }
        }

        // Export Real .GLB 3D File Directly to User's Machine
        function exportGLB() {
            showToast('Generating binary .GLB 3D model...');
            const exporter = new THREE.GLTFExporter();
            exporter.parse(
                hoverVanGroup,
                (result) => {
                    const blob = new Blob([result], { type: 'application/octet-stream' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'scifi_hover_van_3d_model.glb';
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast('Downloaded scifi_hover_van_3d_model.glb!');
                },
                { binary: true }
            );
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // Smooth Camera Preset Transition
            if (isTransitioningCam) {
                camera.position.lerp(targetCamPos, 0.08);
                controls.target.lerp(targetLookAt, 0.08);
                if (camera.position.distanceTo(targetCamPos) < 0.03) {
                    isTransitioningCam = false;
                }
            }

            // Optional 360° Turntable Rotation
            if (isTurntable) {
                hoverVanGroup.rotation.y += 0.005;
            }

            // Subtle Hovering, Radar Scanning & Thruster Pulse
            if (isAnimating) {
                const explodeEl = document.getElementById('explode-slider');
                const explodeFactor = explodeEl ? parseFloat(explodeEl.value) : 0;
                if (explodeFactor === 0) {
                    hoverVanGroup.position.y = Math.sin(t * 2.2) * 0.065;
                    hoverVanGroup.rotation.z = Math.sin(t * 1.5) * 0.008;
                }

                // Radar Dish Gentle Sweep around the Reference Isometric Angle
                if (radarAssemblyGroup) {
                    if (manualRadarAngle !== null) {
                        radarAssemblyGroup.rotation.y = manualRadarAngle;
                    } else {
                        radarAssemblyGroup.rotation.y = 0.68 + Math.sin(t * 0.85) * 0.22;
                    }
                }

                // Thruster Pad Stabilization & Electric Blue Flame Jet Flutter Animation
                thrustersGroup.forEach((th, idx) => {
                    th.group.rotation.z = -th.side * 0.26 + Math.sin(t * 3.2 + idx) * 0.025;
                });

                // Electric Blue Plasma Flame Jets Dynamics & Floor Glow Pulse
                thrusterFlames.forEach((item, fIdx) => {
                    if (item.type === 'flame') {
                        // High-frequency turbulent plasma flame jet length oscillation
                        const flameFlicker = Math.sin(t * 22.0 + item.offset) * 0.14 + Math.cos(t * 37.0 + fIdx) * 0.06;
                        const jetScaleY = 1.0 + flameFlicker;
                        const jetScaleXZ = 1.0 + Math.sin(t * 18.0 + fIdx) * 0.08;

                        item.container.scale.set(jetScaleXZ, jetScaleY, jetScaleXZ);
                        item.main.material.opacity = 0.72 + Math.sin(t * 26.0 + fIdx) * 0.16;
                        item.outer.material.opacity = 0.38 + Math.cos(t * 24.0 + fIdx) * 0.12;

                        // Shock rings pulse downward
                        if (item.rings) {
                            item.rings[0].position.y = -0.26 + Math.sin(t * 15.0 + fIdx) * 0.04;
                            item.rings[1].position.y = -0.52 + Math.sin(t * 17.0 + fIdx) * 0.05;
                        }
                    } else if (item.type === 'groundDisc') {
                        // Pulsing Electric Blue floor reflection beneath each flame
                        const discPulse = 1.0 + Math.sin(t * 12.0 + fIdx) * 0.12;
                        item.mesh.scale.set(discPulse, discPulse, discPulse);
                        item.mesh.material.opacity = 0.30 + Math.sin(t * 14.0 + fIdx) * 0.10;
                    }
                });
            } else if (manualRadarAngle !== null && radarAssemblyGroup) {
                radarAssemblyGroup.rotation.y = manualRadarAngle;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = initScene;
    </script>
</body>
</html>
